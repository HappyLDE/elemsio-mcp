name: MCP documentation CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation-contract:
    # Canonical compute is the Lenovo VM. The owner-only repository variable ELEMS_CI_HOST=deck
    # selects the qualified Steam Deck VM instead; any other value or no value keeps the Lenovo.
    runs-on: [self-hosted, linux, x64, elems-ci, "${{ vars.ELEMS_CI_HOST == 'deck' && 'elems-deck-vm' || 'elems-lenovo-vm' }}"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify isolated CI workspace
        run: |
          test "$RUNNER_WORKSPACE" = /opt/actions-runner/_work/elemsio-mcp
          test "$GITHUB_WORKSPACE" = "$RUNNER_WORKSPACE/elemsio-mcp"
          test ! -e /home/leosilver
          test ! -e /home/runner/probe-contamination
          printf 'Runner: %s\nWorkspace: %s\n' "$RUNNER_NAME" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
      - run: npm run resources:size
      - run: git diff --check
