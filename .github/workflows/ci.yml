name: MCP documentation CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mcp-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
      - run: npm run resources:size
      - run: git diff --check
